<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="Portofolio pribadi — game, web, dan karya lainnya.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="home" data-audio="on">

<!-- Latar video: hanya tampil di menu utama (diatur lewat body[data-screen]) -->
<div class="bg-video" aria-hidden="true">
  <video autoplay muted loop playsinline preload="metadata">
    <source src="assets/bg.mp4" type="video/mp4">
  </video>
  <div class="bg-veil"></div>
</div>

<header class="hud">
  <button class="hud-tag" id="nav-home">PORTFOLIO // <span id="hud-nama">RAFFI</span></button>
  <span class="hud-tag dim" id="hud-peran">PEMULA · WEB &amp; GAME</span>
</header>

<main>

  <!-- LAYAR 1: HOME -->
  <section class="screen active" id="home" aria-label="Menu utama">
    <p class="eyebrow">Take a look at my work</p>
    <h1 class="nama" id="nama-besar"></h1>
    <p class="tagline" id="tagline"></p>

    <nav class="menu" aria-label="Bagian portofolio">
      <button data-target="projects"><span>PROJECTS</span><span class="mark" aria-hidden="true">◀</span></button>
      <button data-target="skills"><span>SKILLS</span><span class="mark" aria-hidden="true">◀</span></button>
      <button data-target="about"><span>ABOUT</span><span class="mark" aria-hidden="true">◀</span></button>
      <button data-target="contact"><span>CONTACT</span><span class="mark" aria-hidden="true">◀</span></button>
    </nav>
  </section>

  <!-- LAYAR 2: PROJECTS -->
  <section class="screen" id="projects" aria-label="Proyek">
    <h2 class="judul">PROJECTS</h2>
    <button class="back" data-back>ESC · Kembali</button>
    <div id="project-grid" class="grid"></div>
  </section>

  <!-- LAYAR 3: SKILLS -->
  <section class="screen" id="skills" aria-label="Kemampuan">
    <h2 class="judul">SKILLS</h2>
    <button class="back" data-back>ESC · Kembali</button>
    <div id="skill-list"></div>
  </section>

  <!-- LAYAR 4: ABOUT -->
  <section class="screen" id="about" aria-label="Tentang saya">
    <h2 class="judul">ABOUT</h2>
    <button class="back" data-back>ESC · Kembali</button>
    <div class="paper">
      <div class="monogram" id="monogram" aria-hidden="true">R</div>
      <div id="tentang-teks"></div>
    </div>
  </section>

  <!-- LAYAR 5: CONTACT -->
  <section class="screen" id="contact" aria-label="Kontak">
    <h2 class="judul">CONTACT</h2>
    <button class="back" data-back>ESC · Kembali</button>
    <div class="chips" id="contact-list"></div>
  </section>

</main>

<footer class="hud bawah">
  <span><b>↑↓</b> pilih</span>
  <span><b>Enter</b> buka</span>
  <span><b>Esc</b> kembali</span>
  <span class="dim" id="status">HTML · CSS · JS murni</span>
</footer>

<!-- Panel sapuan layar (diisi CSS, bukan gambar) -->
<div id="wipe" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- Suara menu: disintesis browser, tanpa file audio -->
<button id="audio-toggle" aria-pressed="false" aria-label="Nyalakan suara menu">✕</button>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
